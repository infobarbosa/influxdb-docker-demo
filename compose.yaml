services:
  influxdb:
    image: influxdb:3-core
    container_name: influxdb-demo
    command: serve --node-id demo --object-store file --data-dir /var/lib/influxdb3 --without-auth
    ports:
      - "8181:8181"
    volumes:
      - influxdb3-data:/var/lib/influxdb3

  influxproducer:
    image: alpine/curl
    container_name: influxproducer
    environment:
      - INFLUXDB_URL=http://influxdb-demo:8181
      - DATABASE=ecommerce
    volumes:
      - ./pedidos.sh:/pedidos.sh:ro
    command: ["/bin/sh", "/pedidos.sh"]
    depends_on:
      - influxdb
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/influxdb.yaml:ro
    depends_on:
      - influxdb

volumes:
  influxdb3-data:
